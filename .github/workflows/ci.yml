# CI floor (workspace improvement 3, 2026-09-05). Generated by _reference/ci/generate-ci.mjs in the
# workspace umbrella; edit the table there and re-run rather than hand-editing this file.
# pnpm verify = typecheck, lint:deps (dependency-cruiser rules from the LikeC4 model, feat/dependency-cruiser branch), test; vite build directly because pnpm build runs the preflight, which refuses to start without an OpenRouter key by design.
#
# checks: the repo's own executable checks, frozen install. review: Anthropic's claude-code-action runs the
# code-review plugin on every non-draft pull request and posts one inline comment per finding. It never
# blocks a merge; branch protection decides that. Auth is CLAUDE_CODE_OAUTH_TOKEN (claude setup-token),
# which bills to the Max plan and is tied to the account that generated it. Without that secret the
# review job skips and says so; it never fails a pull request over a missing secret.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # pnpm before setup-node so the cache has a package manager to find; the version comes from
      # the packageManager field in package.json, so CI and the workstation run one pnpm.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: npx vite build

  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "CLAUDE_CODE_OAUTH_TOKEN not set; pull-request review skipped"; fi

  review:
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: |
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
