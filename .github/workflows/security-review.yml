# Security review on every pull request (workspace improvement 2, CI half, 2026-09-05). Generated by
# _reference/ci/generate-ci.mjs; edit there. Anthropic's open-source security-review action scans the diff
# for vulnerabilities and comments inline with severity and remediation. It takes an API key only, billed
# at API rates outside the Max plan, so the job is gated: no ANTHROPIC_API_KEY secret, no run, no failure.
name: security-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "ANTHROPIC_API_KEY not set; security review skipped"; fi

  security:
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: anthropics/claude-code-security-review@main
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
          upload-results: true
          claudecode-timeout: 20
